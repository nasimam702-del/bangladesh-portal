<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bangladesh Seba Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #F0F4F0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(0,106,78,0.12); }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo h1 { color: #006A4E; font-size: 1.4rem; }
        .logo p { color: #888; font-size: 0.85rem; margin-top: 4px; }
        h2 { color: #1a2e1a; font-size: 1.3rem; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.9rem; font-weight: 600; color: #333; margin-bottom: 6px; }
        input { width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 1rem; outline: none; transition: border 0.2s; }
        input:focus { border-color: #006A4E; }
        .btn { width: 100%; padding: 13px; background: #006A4E; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px; }
        .btn:hover { background: #004d38; }
        .error { background: #fff0f0; color: #c0001f; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 0.88rem; border-left: 4px solid #F42A41; }
        .link { text-align: center; margin-top: 16px; font-size: 0.88rem; color: #666; }
        .link a { color: #006A4E; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>🇧🇩 Bangladesh Seba Portal</h1>
        <p>Login to your account</p>
    </div>
    <h2>Login</h2>
    {% if error %}
    <div class="error">⚠️ {{ error }}</div>
    {% endif %}
    <form method="POST">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Your email" required />
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Your password" required />
        </div>
        <button type="submit" class="btn">Login</button>
    </form>
    <div class="link">New user? <a href="/register">Register</a></div>
</div>
</body>
</html>
