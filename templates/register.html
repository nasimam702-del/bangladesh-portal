<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রেজিস্টার | Register - বাংলাদেশ সেবা পোর্টাল</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Hind Siliguri', Arial, sans-serif; background: #F0F4F0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(0,106,78,0.12); }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo h1 { color: #006A4E; font-size: 1.3rem; }
        .logo p { color: #888; font-size: 0.82rem; margin-top: 4px; }
        h2 { color: #1a2e1a; font-size: 1.2rem; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.9rem; font-weight: 600; color: #333; margin-bottom: 6px; }
        input { width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 1rem; font-family: 'Hind Siliguri', Arial, sans-serif; outline: none; transition: border 0.2s; }
        input:focus { border-color: #006A4E; }
        .btn { width: 100%; padding: 13px; background: #006A4E; color: white; border: none; border-radius: 10px; font-size: 1rem; font-family: 'Hind Siliguri', Arial, sans-serif; font-weight: 700; cursor: pointer; margin-top: 8px; }
        .btn:hover { background: #004d38; }
        .error { background: #fff0f0; color: #c0001f; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 0.88rem; border-left: 4px solid #F42A41; }
        .link { text-align: center; margin-top: 16px; font-size: 0.88rem; color: #666; }
        .link a { color: #006A4E; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>🇧🇩 বাংলাদেশ সেবা পোর্টাল</h1>
        <p>Bangladesh Service Portal</p>
    </div>
    <h2>রেজিস্টার করুন | Register</h2>
    {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}
    <form method="POST">
        <div class="form-group">
            <label>নাম | Name</label>
            <input type="text" name="name" placeholder="আপনার পুরো নাম | Your full name" required />
        </div>
        <div class="form-group">
            <label>ইমেইল | Email</label>
            <input type="email" name="email" placeholder="আপনার ইমেইল | Your email" required />
        </div>
        <div class="form-group">
            <label>পাসওয়ার্ড | Password</label>
            <input type="password" name="password" placeholder="কমপক্ষে ৬ অক্ষর | Min 6 characters" required minlength="6" />
        </div>
        <button type="submit" class="btn">রেজিস্টার | Register</button>
    </form>
    <div class="link">ইতিমধ্যে অ্যাকাউন্ট আছে? | Already have an account? <a href="/login">লগইন | Login</a></div>
</div>
</body>
</html>
